function normUrl(u){
  u=String(u||"").trim(); if(!u) return "";
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)||/^(\.{0,2}\/)/.test(u)) return u;
  if(/^[\w\-]+\.(html?|php|pdf|mp4)([?#].*)?$/i.test(u)||!/\./.test(u)) return u;
  return "https://"+u;
}

function fitBox(box,els,over,min){
  if(!box||!box.isConnected) return;
  els=els||[box]; min=min||9;
  els.forEach(e=>{if(!e.dataset.fs)e.dataset.fs=parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=e.dataset.fs+"px";});
  over=over||(()=>box.scrollHeight>box.clientHeight+1||box.scrollWidth>box.clientWidth+1);
  let sc=1;
  for(let i=0;i<50&&over();i++){
    sc*=.95; let done=true;
    els.forEach(e=>{const f=Math.max(min,e.dataset.fs*sc);e.style.fontSize=f+"px";if(f>min)done=false;});
    if(done)break;
  }
}
function fitLine(box,min,pad){const sp=box&&box.firstElementChild;if(!sp)return;const pd=pad==null?48:pad;fitBox(box,[box],()=>sp.offsetWidth>box.clientWidth-pd,min||12);}
function fitDashboard(){
  fitLine($("#tagline"),11,0);
  document.querySelectorAll("#grid .tile").forEach(b=>{
    const ic=b.querySelector(".ic"),lb=b.querySelector(".lb"),sm=lb.querySelector("small");
    const els=sm?[ic,lb,sm]:[ic,lb],over=()=>ic.offsetHeight+lb.offsetHeight>b.clientHeight-16||lb.scrollWidth>b.clientWidth-16;
    lb.style.overflowWrap="";
    fitBox(b,els,over,Math.max(9,parseFloat(lb.dataset.fs||lb.style.fontSize||26)*0.62));
    if(over()){lb.style.overflowWrap="anywhere";fitBox(b,els,over);}   /* kata sangat panjang: boleh dipatah */
  });
  document.querySelectorAll("#news .itx").forEach(x=>fitBox(x,[...x.children]));
  document.querySelectorAll("#car .stx").forEach(x=>fitBox(x,[x.querySelector("h3")]));
}

let pendUp=null; const busy=new Set();
const autoEligible=u=>/^https?:\/\//i.test(normUrl(u));
async function resolveAuto(l){
  const u=normUrl(l.url); let r=null;
  const yt=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/))([\w-]{11})/i);
  if(yt) r={src:"https://i.ytimg.com/vi/"+yt[1]+"/hqdefault.jpg",kind:"img"};
  else if(/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(u)) r={src:u,kind:"img"};
  else{const dr=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i); if(dr) r={src:"https://drive.google.com/thumbnail?id="+dr[1]+"&sz=w640",kind:"img"};}
  if(!r){
    try{
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
      const res=await fetch("https://api.microlink.io/?screenshot=true&url="+encodeURIComponent(u),{signal:ctl.signal}); clearTimeout(to);
      const j=await res.json(),d=(j&&j.data)||{};
      const src=(d.image&&d.image.url)||(d.screenshot&&d.screenshot.url);
      if(src) r={src:src,kind:"img"}; else if(d.logo&&d.logo.url) r={src:d.logo.url,kind:"logo"};
    }catch(e){}
  }
  if(!r) r={src:"https://www.google.com/s2/favicons?sz=128&domain_url="+encodeURIComponent(u),kind:"logo",weak:true};
  return r;
}
function ensureAuto(l,cb){
  const T=l.thumb||{};
  if(!D.thumbs||!D.autoOnline||T.mode!=="auto"||!autoEligible(l.url)||busy.has(l.id)) return;
  const a=l.auto,age=a?Date.now()-a.t:0;
  if(a&&((a.src&&!(a.weak&&age>216e5))||(!a.src&&age<6e5))) return;
  busy.add(l.id);
  resolveAuto(l).then(r=>{l.auto=r?{src:r.src,kind:r.kind,weak:!!r.weak,t:Date.now()}:{src:"",kind:"img",weak:false,t:Date.now()};save();}).catch(()=>{}).then(()=>{busy.delete(l.id);if(cb)cb();});
}
function prefetchThumbs(){

}
function fillThumb(el,l,m,ctx){
  const T=l.thumb||{mode:"auto"}; el.innerHTML="";
  const circ=(v,isImg)=>{const c=document.createElement("div");c.className=ctx+"circ";
    if(isImg){const i=document.createElement("img");i.alt="";i.referrerPolicy="no-referrer";i.onerror=()=>{c.textContent=m.icon;};i.src=v;c.appendChild(i);}else c.textContent=v;el.appendChild(c);};
  const rect=src=>{const i=document.createElement("img");i.className=ctx+"img";i.alt="";i.referrerPolicy="no-referrer";i.onerror=()=>{el.innerHTML="";circ(m.icon,false);};i.src=src;el.appendChild(i);};
  if(!D.thumbs||T.mode==="none") return circ(m.icon,false);
  if(T.mode==="emoji") return circ(T.emoji||m.icon,false);
  if(T.mode==="upload"&&T.data) return rect(T.data);
  if(T.mode==="url"&&T.url) return rect(normUrl(T.url));
  if(T.mode==="auto"&&l.auto&&l.auto.src) return l.auto.kind==="logo"?circ(l.auto.src,true):rect(l.auto.src);
  circ(m.icon,false);
}
function processImg(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const W=480,H=300,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
      const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(im,(W-w)/2,(H-h)/2,w,h);cb(c.toDataURL("image/jpeg",.82));};
    im.onerror=()=>toast("Gambar tidak dapat dibaca.");im.src=fr.result;};
  fr.readAsDataURL(file);
}

async function H(s){
  s="mopani|"+s;
  try{ if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");} }catch(e){}
  let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))|0; return "f"+h;
}

A.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act,id=b.dataset.id,m=cur();
  const mv=(arr,i,d)=>{const j=i+d;if(i<0||j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true;};
  switch(a){
    case "view": closeAdmin(); enterApp(); break;
    case "logout": closeAdmin(); break;
    case "tab": tab=b.dataset.v; renderPanel(); break;
    case "pick": sel=id; edL=null; renderList(); renderEditor(); break;
    case "addMenu": if(D.menus.length>=MAX){toast("Maksimal "+MAX+" menu agar semua kotak tetap muat di layar.");break;}
      {const n=mk(uid(),"Menu Baru","","⭐","biru");D.menus.push(n);sel=n.id;edL=null;save();renderList();renderEditor();const i=A.querySelector('[data-f="name"]');if(i){i.focus();i.select();}} break;
    case "vis": {const x=D.menus.find(z=>z.id===id);x.visible=!x.visible;save();renderList();renderEditor();} break;
    case "up": case "dn": {const i=D.menus.findIndex(z=>z.id===id);if(mv(D.menus,i,a==="up"?-1:1)){save();renderList();}} break;
    case "col": m.col=b.dataset.v; save(); renderList(); A.querySelectorAll(".sw i").forEach(i=>i.classList.toggle("on",i.dataset.v===m.col)); break;
    case "emo": m.icon=b.dataset.v; save(); renderList(); A.querySelector('[data-f="icon"]').value=m.icon; break;
    case "delMenu": ask("Hapus menu \""+m.name+"\" beserta "+m.links.length+" tautannya?",()=>{D.menus=D.menus.filter(z=>z.id!==m.id);sel=null;edL=null;save();renderPanel();toast("Menu dihapus.");}); break;
    case "saveL": {
      const t=$("#lt").value.trim(),u=$("#lu").value.trim(),d=$("#ld").value.trim();
      if(!u){toast("Isi tautan (URL) terlebih dahulu.");break;}
      const mode=$("#tm").value,th={mode:mode,url:$("#tu").value.trim(),emoji:$("#te").value.trim(),data:mode==="upload"?(pendUp||""):""};
      if(mode==="upload"&&!th.data){toast("Pilih gambar yang akan diunggah.");break;}
      if(mode==="url"&&!th.url){toast("Isi alamat gambar thumbnail.");break;}
      const bd=$("#lb").value.trim(),cl=$("#lc").value;
      if(edL){const l=m.links.find(z=>z.id===edL);if(l){if(l.url!==u)l.auto=null;l.title=t||u;l.url=u;l.desc=d;l.thumb=th;l.badge=bd;l.col=cl;}edL=null;}
      else m.links.push(normLink({title:t||u,url:u,desc:d,thumb:th,badge:bd,col:cl}));
      save();renderList();renderEditor();toast("Tautan tersimpan.");} break;
    case "cancelL": edL=null; renderEditor(); break;
    case "edL": edL=id; renderEditor(); $("#lt").focus(); break;
    case "delL": ask("Hapus tautan ini?",()=>{m.links=m.links.filter(z=>z.id!==id);if(edL===id)edL=null;save();renderList();renderEditor();toast("Tautan dihapus.");}); break;
    case "lup": case "ldn": {const i=m.links.findIndex(z=>z.id===id);if(mv(m.links,i,a==="lup"?-1:1)){save();renderEditor();}} break;
    case "test": {const l=m.links.find(z=>z.id===id);window.open(normUrl(l.url),"_blank","noopener");} break;
    case "bulk": {
      const lines=$("#bulk").value.split(/\n/).map(s=>s.trim()).filter(Boolean); let c=0;
      lines.forEach(s=>{const p=s.split("|").map(x=>x.trim()); let t,u,d;
        if(p.length===1){u=p[0];t=u;d="";} else {t=p[0];u=p[1];d=p[2]||"";}
        if(u){m.links.push(normLink({title:t||u,url:u,desc:d}));c++;}});
      if(!c){toast("Tidak ada baris yang valid.");break;} save();renderList();renderEditor();toast(c+" tautan ditambahkan.");} break;
    case "addRec": if(D.recs.length>=5){toast("Maksimal 5 slide.");break;} D.recs.push({tag:"Baru",title:"Judul rekomendasi",icon:"⭐",col:"biru",url:""});save();renderSetTab(); break;
    case "delRec": D.recs.splice(+b.dataset.i,1);save();renderSetTab(); break;
    case "chgPin": (async()=>{
      const au=getAuth(),o=$("#op").value,n=$("#np").value,n2=$("#np2").value;
      if(await H(o)!==au.pin){toast("PIN lama salah.");return;}
      if(!/^\d{4,8}$/.test(n)){toast("PIN baru harus 4–8 angka.");return;}
      if(n!==n2){toast("Kedua PIN baru tidak sama.");return;}
      au.pin=await H(n);setAuth(au);$("#op").value=$("#np").value=$("#np2").value="";toast("PIN berhasil diganti.");})(); break;
    case "export": {
      const blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),x=document.createElement("a");
      x.href=u;x.download="mopani-data-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);} break;
    case "dlhtml": {
      save();
      const js=JSON.stringify(D).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
      const html=SRC.replace(/(<script type="application\/json" id="mopani-embed">)[\s\S]*?(<\/script>)/,(m,a,c)=>a+js+c);
      const blob=new Blob([html],{type:"text/html"}),u=URL.createObjectURL(blob),x=document.createElement("a");
      x.href=u;x.download="mokopani.html";document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
      toast("File mokopani.html diunduh. Semua pengaturan ikut tersimpan di dalamnya.");} break;
    case "sr_read": {const a=getSaran(),x=a.find(z=>z.id===id);if(x){x.read=!x.read;setSaran(a);renderPanel();}} break;
    case "sr_readall": {const a=getSaran();a.forEach(x=>x.read=true);setSaran(a);renderPanel();} break;
    case "sr_reply": {const a=getSaran(),x=a.find(z=>z.id===id),v=($("#rp_"+id)||{}).value||"";if(x){x.reply=v.trim();x.replyAt=x.reply?new Date().toISOString():"";x.read=true;if(setSaran(a)){renderPanel();toast("Tanggapan tersimpan.");}}} break;
    case "sr_del": ask("Hapus saran ini?",()=>{setSaran(getSaran().filter(z=>z.id!==id));renderPanel();toast("Saran dihapus.");}); break;
    case "sr_delall": ask("Hapus SEMUA saran yang masuk? Tindakan ini tidak dapat dibatalkan.",()=>{setSaran([]);renderPanel();toast("Semua saran dihapus.");},"Ya, hapus semua"); break;
    case "sr_json": srDownload("saran-mokopani-"+new Date().toISOString().slice(0,10)+".json","application/json",JSON.stringify(getSaran(),null,2)); break;
    case "sr_csv": {
      const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',rows=[["Tanggal","Saran","Status dibaca","Tanggapan","Tanggal tanggapan"]].concat(getSaran().sort((a,b)=>String(a.t).localeCompare(String(b.t))).map(x=>[fmtDate(x.t),x.s,x.read?"Sudah":"Belum",x.reply,x.replyAt?fmtDate(x.replyAt):""]));
      srDownload("saran-mokopani-"+new Date().toISOString().slice(0,10)+".csv","text/csv;charset=utf-8","\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n"));} break;
    case "addDd": {const L=ddList(b.dataset.k),mx=b.dataset.k==="topbtns"?4:12;if(L.length>=mx){toast("Maksimal "+mx+".");break;} L.push({id:uid(),icon:"⭐",label:"Baru",type:"link",url:""});save();renderSetTab();} break;
    case "ddDel": ddList(b.dataset.k).splice(+b.dataset.i,1);save();renderSetTab(); break;
    case "ddUp": case "ddDn": {const i=+b.dataset.i;if(mv(ddList(b.dataset.k),i,a==="ddUp"?-1:1)){save();renderSetTab();}} break;
    case "reauto": D.menus.forEach(x=>x.links.forEach(l=>{l.auto=null;}));save();toast("Thumbnail otomatis akan dimuat ulang saat dibutuhkan.");prefetchThumbs();break;
    case "reset": ask("Kembalikan semua menu, tautan, dan pengaturan ke bawaan? Tindakan ini tidak dapat dibatalkan.",()=>{D=DEFAULT();sel=null;save();renderPanel();toast("Data dikembalikan ke bawaan.");},"Ya, kembalikan"); break;
  }
});

A.addEventListener("change",e=>{
  const t=e.target,m=cur();
  if(t.id==="srf"){srFilter=t.value;renderSaranTab();return;}
  if(t.id==="simp"){const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;const a=getSaran(),seen=new Set(a.map(x=>x.id+"|"+x.t+"|"+x.s));let c=0;
      j.forEach(x=>{if(x&&typeof x.s==="string"){const y={id:String(x.id||uid()),t:x.t||"",s:x.s,read:!!x.read,reply:String(x.reply||""),replyAt:x.replyAt||""};const k=y.id+"|"+y.t+"|"+y.s;if(!seen.has(k)&&!a.some(z=>z.t===y.t&&z.s===y.s)){a.push(y);seen.add(k);c++;}}});
      if(setSaran(a)){renderPanel();toast(c+" saran baru digabungkan.");}}catch(e){toast("File tidak valid. Gunakan file JSON hasil Ekspor saran.");}};
    r.readAsText(f);t.value="";return;}
  if(t.id==="tm"){syncTm();updatePrev();return;}
  if(t.id==="tu"||t.id==="te"||t.id==="lu"){updatePrev();return;}
  if(t.id==="tf"){const f=t.files[0];if(f)processImg(f,d=>{pendUp=d;updatePrev();toast("Gambar siap. Tekan Simpan/Tambah.");});return;}
  if(t.dataset.sb){D[t.dataset.sb]=t.checked;save();return;}
  if(t.id==="imp"){
    const f=t.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.menus))throw 0;
      ask("Impor data? Menu, tautan, dan pengaturan saat ini akan diganti ("+j.menus.length+" menu).",()=>{D=norm(j);sel=null;save();renderPanel();toast("Data berhasil diimpor.");},"Ya, impor");}
      catch(x){toast("File tidak valid. Gunakan file hasil Ekspor MOKOPANi.");}};
    r.readAsText(f); t.value=""; return;
  }
  if(t.dataset.f&&m){const f=t.dataset.f; m[f]=f==="visible"?t.checked:t.value.trim(); if(f==="name"&&!m.name){m.name="Menu";t.value="Menu";} save(); renderList(); return;}
  if(t.dataset.w){D.welcome[t.dataset.w]=t.value;save();return;}
  if(t.dataset.ddl){D.dropdown.label=t.value.trim()||"Menu";save();return;}
  if(t.dataset.dd){const [kk,rest]=t.dataset.dd.split("|"),[i,k]=rest.split(".");const it=ddList(kk)[+i];if(it){it[k]=t.value.trim();if(k==="label"&&!it.label){it.label="Baru";t.value="Baru";}save();if(k==="type")renderSetTab();}return;}
  if(t.dataset.bb){D.bubble[t.dataset.bb]=t.checked;save();return;}
  if(t.id==="bbm"){const L=t.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(L.length>10)toast("Maksimal 10 ucapan; sisanya diabaikan.");D.bubble.msgs=L.slice(0,10).map(x=>x.slice(0,120));save();return;}
  if(t.id==="bbs"){D.bubble.sec=Math.min(30,Math.max(3,+t.value||6));t.value=D.bubble.sec;save();return;}
  if(t.dataset.s){D[t.dataset.s]=t.value; save(); return;}
  if(t.dataset.r){const [i,k]=t.dataset.r.split(".");D.recs[+i][k]=t.value.trim();save();return;}
  if(t.dataset.n){const [i,k]=t.dataset.n.split(".");D.news[+i][k]=t.value.trim();save();return;}
});

function renderWelcome(){
  const w=D.welcome;
  $("#wSub").textContent=w.sub; $("#wSchool").textContent=w.school;$("#wSchool").style.display=w.school?"":"none";$("#devTxt").textContent=w.dev;document.querySelectorAll("#devSoc button").forEach(b=>b.style.display=w[b.dataset.k]?"":"none");$("#devSoc").style.display=["ig","tt","fb","yt"].some(k=>w[k])?"":"none"; $("#wMotto").textContent=w.motto; $("#wDesc").textContent=w.desc; $("#wTag").innerHTML="<span>"+tagHTML()+"</span>";
  fitWelcome();
}
function showWelcome(){W.classList.remove("hide");$("#picker").classList.remove("on");closeDD();document.documentElement.classList.remove("indash");}
function enterApp(){W.classList.add("hide");document.documentElement.classList.add("indash");}
$("#wEnter").addEventListener("click",enterApp);
$("#devClose").addEventListener("click",()=>$("#devBox").classList.remove("on"));
$("#devBox").addEventListener("click",e=>{if(e.target.id==="devBox")$("#devBox").classList.remove("on");});
$("#wSet").addEventListener("click",openAdmin);

/* ===================== HEADER DASHBOARD ===================== */
function getTheme(){try{return localStorage.getItem("mopani_theme")==="light"?"light":"dark";}catch(e){return "dark";}}
function applyTheme(m){document.documentElement.classList.toggle("light",m==="light");document.querySelectorAll("#ddPanel .thm").forEach(b=>b.setAttribute("aria-checked",m==="light"?"false":"true"));}
function setTheme(m){try{localStorage.setItem("mopani_theme",m);}catch(e){}applyTheme(m);}
applyTheme(getTheme());
document.querySelectorAll("#devSoc button").forEach(b=>b.addEventListener("click",()=>{let u=(D.welcome[b.dataset.k]||"").trim();if(u)openUrl(u);}));
function openDev(){$("#devBox").classList.add("on");fitBox($("#devTxt"));}
function closeDD(){const pn=$("#ddPanel");if(pn){pn.classList.remove("open");$("#ddBtn").setAttribute("aria-expanded","false");}}
function renderHeader(){
  const dd=D.dropdown,pn=$("#ddPanel");$("#ddLabel").textContent=dd.label||"Menu";$("#ddWrap").style.display=dd.items.length?"":"none";pn.innerHTML="";
  dd.items.forEach(it=>{const b=document.createElement("button");b.type="button";b.setAttribute("role","menuitem");
    const i=document.createElement("span");i.className="ic";i.textContent=it.icon;const l=document.createElement("span");l.className="lb";l.textContent=it.label;b.appendChild(i);b.appendChild(l);
    if(it.type==="theme"){b.classList.add("thm");const sw=document.createElement("span");sw.className="tgl";sw.innerHTML="<em>☀️</em><em>🌙</em><u></u>";b.appendChild(sw);b.setAttribute("role","menuitemcheckbox");b.addEventListener("click",e=>{e.stopPropagation();setTheme(getTheme()==="light"?"dark":"light");});}
    else b.addEventListener("click",()=>{closeDD();runItem(it);});
    pn.appendChild(b);});
  const tb=$("#topBtns");tb.innerHTML="";D.topbtns.forEach(it=>{const b=document.createElement("button");b.type="button";b.className="hb";b.textContent=it.icon;b.title=it.label;b.setAttribute("aria-label",it.label);b.addEventListener("click",()=>runItem(it));tb.appendChild(b);});
}
function runItem(it){
  if(it.type==="home")showWelcome();
  else if(it.type==="dev")openDev();
  else if(it.type==="admin")openAdmin();
  else if(it.type==="theme")setTheme(getTheme()==="light"?"dark":"light");
  else if(it.type==="saran"){const p=document.querySelector(".p3");p.classList.remove("flash");void p.offsetWidth;p.classList.add("flash");$("#saran").focus();}
  else if(it.url)openUrl(it.url);else toast("\""+it.label+"\" belum ditautkan. Atur di Pengaturan pengelola.");
}
$("#ddBtn").addEventListener("click",e=>{e.stopPropagation();const o=$("#ddPanel").classList.toggle("open");$("#ddBtn").setAttribute("aria-expanded",o?"true":"false");});
document.addEventListener("click",e=>{if(!e.target.closest("#ddWrap"))closeDD();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDD();$("#devBox").classList.remove("on");}});
$("#fsBtn").addEventListener("click",fsToggle);
(function(){let n=0,t=0;const lg=document.querySelector("#dtop .logo");if(lg)lg.addEventListener("click",()=>{const now=Date.now();n=now-t>1500?1:n+1;t=now;if(n>=5){n=0;openAdmin();}});})();
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==="P"||e.key==="p")){e.preventDefault();openAdmin();}});

renderWelcome();
renderLanding();
if(D.startDash&&location.hash!=="#admin")enterApp();
</script>
</body>
</html>
